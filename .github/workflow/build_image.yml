name: Build and Push jinli-home to GHCR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set Git commit date tag
        id: get_date
        run: |
          DATE_TAG=$(git log -1 --format=%cd --date=format:%Y.%m.%d)
          echo "tag=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jinli-home:latest
            ghcr.io/${{ github.repository_owner }}/jinli-home:${{ steps.get_date.outputs.tag }}
